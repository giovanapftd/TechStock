services:

  db:
    image: postgres:17
    container_name: techstock-db   # Nome do CONTAINER

    environment:
      POSTGRES_DB: techstock   # Nome do BANCO DE DADOS
      POSTGRES_USER: giovana   # Nome de USUÁRIO
      POSTGRES_PASSWORD: giovana123   # Criação de SENHA para o USUÁRIO

    ports:
      - "5432:5432"

    volumes:
      - techstock_postgres_data:/var/lib/postgresql/data



  backend:
    build:
      context: ./backend

    container_name: techstock-backend

    ports:
      - "8080:8080"

    depends_on:
      - db

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/techstock
      SPRING_DATASOURCE_USERNAME: giovana
      SPRING_DATASOURCE_PASSWORD: giovana123
      # Senha inicial da conta administrativa; definida fora do código.
      TECHSTOCK_ADMIN_PASSWORD: ${TECHSTOCK_ADMIN_PASSWORD:-}

volumes:
  techstock_postgres_data: